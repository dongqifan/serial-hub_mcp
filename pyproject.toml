[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-hub-mcp"
version = "0.4.0"
description = "Shared serial consoles for multiple MCP sessions and Telnet terminals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pyserial>=3.5,<4",
  "mcp>=1.20,<2",
  "telnetlib3>=2.0.8,<3",
  "httpx>=0.28,<1",
  "starlette>=0.40,<2",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
serial-hub = "serial_hub_mcp.cli:main"
serial-hub-mcp = "serial_hub_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
